  </style>
</head>

      let h = 2166136261;
      const p = 'AHT_PROD_SALT::' + String(text || '');
      for (let i = 0; i < p.length; i++) { h ^= p.charCodeAt(i); h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24); }
      return (h >>> 0).toString(16);
    }

    function compressImage(file, maxW = 960) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onerror = () => reject(new Error('Gagal membaca file.'));
        r.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('Gambar tidak valid.'));
          img.onload = () => {
            const sc = img.width > maxW ? maxW / img.width : 1;
            const c = document.createElement('canvas');
            c.width = Math.round(img.width * sc);
            c.height = Math.round(img.height * sc);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            resolve(c.toDataURL('image/jpeg', 0.78));
          };
          img.src = r.result;
        };
        r.readAsDataURL(file);
      });
    }

            ${methodBox}
            ${b.payment_proof ? `<div style="background:var(--color-success-bg);border:1px solid var(--color-success-border);border-radius:var(--radius-md);padding:0.85rem;font-size:0.8rem;"><p style="font-weight:700;margin-bottom:0.5rem;">Bukti terunggah:</p><img src="${escapeHtml(b.payment_proof)}" style="max-height:12rem;border-radius:0.5rem;" /></div>` : ''}
            <form id="proof-form" class="form-stack" style="border-top:1px solid #e8dfd1;padding-top:1rem;">
              <div><label class="form-label">Unggah Bukti Pembayaran (JPG, PNG, WEBP)</label><input id="p-file" class="form-control" type="file" accept="image/jpeg,image/png,image/webp" required /></div>
              <button type="submit" class="btn btn--primary btn--full">Kirim Bukti Pembayaran</button>
            </form>
          </div>
        </div>
      `;
      root.querySelector('#cp-acc')?.addEventListener('click', () => { navigator.clipboard?.writeText(store.settings.account); showToast('Rekening disalin.'); });
      root.querySelector('#cp-code')?.addEventListener('click', () => { navigator.clipboard?.writeText(b.booking_code); showToast('Kode booking disalin.'); });
      root.querySelector('#proof-form').onsubmit = async (e) => {
        e.preventDefault();
        const file = root.querySelector('#p-file').files[0];
        if (!file) return;
        b.payment_proof = await compressImage(file);
        b.payment_proof_name = file.name;
        b.status = 'Menunggu Verifikasi';
        saveData();
        showToast('Bukti pembayaran terkirim!');
        renderPayment(root, code);
      };
    }

    function renderTrack(root) {
      root.innerHTML = `
        <div class="container section-pad narrow-wrap view-animate">
          <a href="#home" class="back-link">← Kembali ke Beranda</a>
          <div class="editorial-card card-pad">
            <span class="badge badge--ochre badge--pill" style="margin-bottom:0.65rem;">Lacak Pemesanan</span>
            <h2 style="font-size:1.65rem;margin-bottom:0.35rem;">Cek Status Pesanan Saya</h2>
            <p class="text-muted" style="font-size:0.875rem;margin-bottom:1.5rem;">Masukkan Kode Booking dan Nomor WhatsApp yang digunakan saat mendaftar.</p>
            <form id="track-form" class="form-stack">
              <div><label class="form-label">Kode Booking</label><input id="t-code" class="form-control font-mono" type="text" required placeholder="Contoh: AHT261125XYZ" /></div>
              <div><label class="form-label">Nomor WhatsApp</label><input id="t-wa" class="form-control" type="tel" required placeholder="0812xxxxxxxx" /></div>
              <p id="t-err" class="alert-error hidden"></p>
              <button type="submit" class="btn btn--forest btn--full">Cari Pesanan</button>
            </form>
            <div id="t-res" class="hidden" style="margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid #e8dfd1;"></div>
          </div>
        </div>
      `;
      root.querySelector('#track-form').onsubmit = (e) => {
        e.preventDefault();
        const code = root.querySelector('#t-code').value.trim().toUpperCase();
        const wa = normalizePhone(root.querySelector('#t-wa').value);
        const found = store.bookings.find(b => b.booking_code.toUpperCase() === code && normalizePhone(b.whatsapp) === wa);
        const err = root.querySelector('#t-err'), res = root.querySelector('#t-res');
        if (!found) { res.classList.add('hidden'); err.textContent = 'Pesanan tidak ditemukan.'; err.classList.remove('hidden'); return; }
        err.classList.add('hidden');
        res.innerHTML = `<div class="form-stack"><div style="display:flex;justify-content:space-between;"><strong class="font-mono">${escapeHtml(found.booking_code)}</strong><span class="badge badge--pill badge--status-ok">${escapeHtml(found.status)}</span></div><p>Destinasi: <strong>${escapeHtml(found.destination_name)}</strong> (${found.participants} orang)</p><a href="#payment/${escapeHtml(found.booking_code)}" class="btn btn--primary btn--sm" style="align-self:flex-start;">Buka Halaman Pembayaran →</a></div>`;
        res.classList.remove('hidden');
      };
    }

    function renderAdminLogin(root) {
      root.innerHTML = `
        <div class="container section-pad narrow-wrap-sm view-animate">
          <a href="#home" class="back-link">← Kembali ke Beranda</a>
          <div class="editorial-card card-pad">
            <span class="badge badge--forest" style="margin-bottom:0.75rem;">Akses Terbatas</span>
            <h2 style="font-size:1.6rem;margin-bottom:0.35rem;">Login Khusus Admin</h2>
            <p class="text-muted" style="font-size:0.84rem;margin-bottom:1.5rem;">Halaman ini hanya untuk pengelola AcehHypeTrip. Pengguna umum tidak memiliki akses masuk.</p>
            <form id="login-form" class="form-stack">
              <div><label class="form-label">Username Admin</label><input id="l-user" class="form-control" type="text" required placeholder="Masukkan username admin" /></div>
              <div><label class="form-label">Password</label><input id="l-pass" class="form-control" type="password" required placeholder="Masukkan password admin" /></div>
              <p id="l-err" class="alert-error hidden"></p>
              <button type="submit" class="btn btn--forest btn--lg btn--full">Masuk ke Dashboard Admin</button>
            </form>
          </div>
        </div>
      `;
      root.querySelector('#login-form').onsubmit = (e) => {
        e.preventDefault();
        const creds = JSON.parse(localStorage.getItem(AUTH_KEY));
        if (root.querySelector('#l-user').value.trim() === creds.username && hashPass(root.querySelector('#l-pass').value) === creds.passHash) {
          sessionStorage.setItem(SESSION_KEY, 'verified');
          showToast('Login berhasil.');
          location.hash = '#admin';
        } else {
          const err = root.querySelector('#l-err');
          err.textContent = 'Username atau password salah.';
          err.classList.remove('hidden');
        }
      };
    }

    function renderAdmin(root) {
      if (!isAdmin()) { location.hash = '#admin-login'; return; }
      const pending = store.bookings.filter(b => b.status === 'Menunggu Verifikasi').length;
      const editItem = store.editingDestinationId ? store.destinations.find(d => d.id === store.editingDestinationId) : null;
      const tabLabels = { destinations: 'Destinasi', bookings: 'Pemesanan', gallery: 'Galeri', about: 'Tentang Kami', settings: 'Pengaturan' };

      root.innerHTML = `
        <div class="container section-pad-sm view-animate">
          <div class="admin-header">
            <div><span class="badge badge--ochre" style="margin-bottom:0.35rem;">Sesi Admin Terverifikasi</span><h2 style="font-size:1.75rem;">Dashboard Admin AcehHypeTrip</h2></div>
            <div style="display:flex;gap:0.5rem;">
              <button id="adm-reset" type="button" class="btn btn--danger btn--sm">Reset Data</button>
              <button id="adm-logout" type="button" class="btn btn--forest btn--sm">Keluar (Logout)</button>
            </div>
          </div>
          <div class="grid-stats">
            <div class="editorial-card card-pad"><span class="form-label text-muted">Destinasi</span><strong style="font-size:1.6rem;">${store.destinations.length}</strong></div>
            <div class="editorial-card card-pad"><span class="form-label text-muted">Pemesanan</span><strong style="font-size:1.6rem;">${store.bookings.length}</strong></div>
            <div class="editorial-card card-pad"><span class="form-label text-muted">Perlu Verifikasi</span><strong class="text-terracotta" style="font-size:1.6rem;">${pending}</strong></div>
            <div class="editorial-card card-pad"><span class="form-label text-muted">Galeri</span><strong style="font-size:1.6rem;">${store.gallery.length}</strong></div>
          </div>
          <div class="admin-tabs">
            ${Object.keys(tabLabels).map(t => `<button type="button" data-tab="${t}" class="btn btn--sm ${store.adminTab === t ? 'btn--forest' : 'btn--outline'}">${tabLabels[t]}</button>`).join('')}
          </div>
          <div id="adm-body"></div>
        </div>
      `;

      root.querySelector('#adm-logout').onclick = () => { sessionStorage.removeItem(SESSION_KEY); showToast('Logout berhasil.'); location.hash = '#home'; };
      root.querySelector('#adm-reset').onclick = () => { localStorage.removeItem(DATA_KEY); loadData(); showToast('Data direset.'); renderAdmin(root); };
      root.querySelectorAll('.admin-tabs button').forEach(b => { b.onclick = () => { store.adminTab = b.dataset.tab; renderAdmin(root); }; });

      const body = root.querySelector('#adm-body');
      if (store.adminTab === 'destinations') {
        body.innerHTML = `
          <div class="form-stack">
            <div class="editorial-card card-pad">
              <div style="display:flex;justify-content:space-between;margin-bottom:1rem;">
                <h3>${editItem ? 'Edit Destinasi: ' + escapeHtml(editItem.name) : 'Tambah Destinasi Open Trip'}</h3>
                ${editItem ? '<button id="cancel-ed" type="button" class="btn btn--sage btn--sm">Batal Edit</button>' : ''}
              </div>
              <form id="d-form" class="form-grid-3">
                <div><label class="form-label">Nama</label><input id="d-name" class="form-control" required value="${escapeHtml(editItem?.name || '')}" /></div>
                <div><label class="form-label">Lokasi</label><input id="d-loc" class="form-control" required value="${escapeHtml(editItem?.location || '')}" /></div>
                <div><label class="form-label">Titik Maps / Koordinat</label><input id="d-map" class="form-control" value="${escapeHtml(editItem?.map_query || '')}" placeholder="Cth: 5.554,95.221 atau Nama Tempat" /></div>
                <div><label class="form-label">Tanggal</label><input id="d-date" class="form-control" type="date" required value="${escapeHtml(editItem?.trip_date || '2026-12-28')}" /></div>
                <div><label class="form-label">Harga</label><input id="d-price" class="form-control" type="number" required value="${editItem?.price ?? 175000}" /></div>
                <div><label class="form-label">Kuota</label><input id="d-quota" class="form-control" type="number" required value="${editItem?.quota ?? 16}" /></div>
                <div><label class="form-label">Status</label><select id="d-status" class="form-control"><option value="Aktif" ${editItem?.status !== 'Draft' ? 'selected' : ''}>Aktif</option><option value="Draft" ${editItem?.status === 'Draft' ? 'selected' : ''}>Draft</option></select></div>
                <div><label class="form-label">URL Foto (Opsional)</label><input id="d-url" class="form-control" type="url" value="${escapeHtml(editItem?.image?.startsWith('http') ? editItem.image : '')}" /></div>
                <div><label class="form-label">Atau Unggah Foto Lokal</label><input id="d-file" class="form-control" type="file" accept="image/jpeg,image/png,image/webp" /></div>
                <div style="grid-column:1/-1;"><label class="form-label">Deskripsi</label><input id="d-desc" class="form-control" required value="${escapeHtml(editItem?.description || '')}" /></div>
                <div style="grid-column:1/-1;"><button type="submit" class="btn btn--primary">${editItem ? 'Simpan Perubahan' : '+ Tambah Destinasi'}</button></div>
              </form>
            </div>
            <div class="editorial-card table-wrap"><table class="data-table"><thead><tr><th>Nama</th><th>Lokasi</th><th>Tanggal</th><th>Harga</th><th>Kuota</th><th>Maps</th><th>Status</th><th style="text-align:right;">Aksi</th></tr></thead><tbody>
              ${store.destinations.map(d => `<tr><td><strong>${escapeHtml(d.name)}</strong></td><td>${escapeHtml(d.location)}</td><td>${formatDateId(d.trip_date)}</td><td class="text-terracotta">${formatRupiah(d.price)}</td><td>${d.quota}</td><td><button type="button" data-adm-map="${d.id}" class="btn btn--outline btn--xs">📍 Cek</button></td><td>${d.status}</td><td style="text-align:right;"><button type="button" data-ed="${d.id}" class="btn btn--outline btn--sm">Edit</button> <button type="button" data-dl="${d.id}" class="btn btn--danger btn--sm">Hapus</button></td></tr>`).join('')}
            </tbody></table></div>
          </div>
        `;
        body.querySelector('#cancel-ed')?.addEventListener('click', () => { store.editingDestinationId = null; renderAdmin(root); });
        body.querySelector('#d-form').onsubmit = async (e) => {
          e.preventDefault();
          const name = body.querySelector('#d-name').value.trim();
          const loc = body.querySelector('#d-loc').value.trim();
          const mapQ = body.querySelector('#d-map').value.trim() || `${name}, ${loc}, Aceh`;
          const file = body.querySelector('#d-file')?.files?.[0];
          const img = file ? await compressImage(file) : sanitizeUrl(body.querySelector('#d-url').value, editItem?.image || FALLBACK_IMG);
          const payload = {
            name, location: loc, map_query: mapQ,
            trip_date: body.querySelector('#d-date').value, price: Number(body.querySelector('#d-price').value) || 0,
            quota: Number(body.querySelector('#d-quota').value) || 0, status: body.querySelector('#d-status').value,
            image: img, description: body.querySelector('#d-desc').value.trim()
          };
          if (editItem) Object.assign(editItem, payload);
          else store.destinations.unshift({ id: Date.now(), ...payload });
          store.editingDestinationId = null; saveData(); showToast('Destinasi disimpan.'); renderAdmin(root);
        };
        body.querySelectorAll('[data-adm-map]').forEach(b => b.onclick = () => { const t = store.destinations.find(d => d.id === Number(b.dataset.admMap)); if (t) openMapModal(t); });
        body.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => { store.editingDestinationId = Number(b.dataset.ed); renderAdmin(root); });
        body.querySelectorAll('[data-dl]').forEach(b => b.onclick = () => { store.destinations = store.destinations.filter(d => d.id !== Number(b.dataset.dl)); saveData(); renderAdmin(root); });
      } else if (store.adminTab === 'bookings') {
        const statuses = ['Menunggu Pembayaran', 'Menunggu Verifikasi', 'Diterima', 'Ditolak'];
        body.innerHTML = `<div class="editorial-card table-wrap"><table class="data-table"><thead><tr><th>Kode</th><th>Peserta</th><th>Destinasi</th><th>Total</th><th>Bukti</th><th>Status</th></tr></thead><tbody>
          ${store.bookings.length ? store.bookings.map(b => `<tr><td class="font-mono">${escapeHtml(b.booking_code)}</td><td><strong>${escapeHtml(b.customer_name)}</strong><br/><span class="text-muted">${escapeHtml(b.whatsapp)}</span></td><td>${escapeHtml(b.destination_name)} (${b.participants} org)</td><td class="text-terracotta">${formatRupiah(b.total_price)}</td><td>${b.payment_proof ? `<button type="button" data-pf="${b.booking_code}" class="btn btn--outline btn--sm">Lihat Bukti</button>` : 'Belum ada'}</td><td><select data-st="${b.booking_code}" class="form-control" style="padding:0.3rem;font-size:0.75rem;">${statuses.map(s => `<option ${b.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></td></tr>`).join('') : '<tr><td colspan="6" style="text-align:center;padding:2rem;">Belum ada pemesanan masuk.</td></tr>'}
        </tbody></table></div>`;
        body.querySelectorAll('[data-pf]').forEach(btn => btn.onclick = () => { const bk = store.bookings.find(x => x.booking_code === btn.dataset.pf); if (bk) openImageModal('Bukti ' + bk.booking_code, bk.payment_proof); });
        body.querySelectorAll('[data-st]').forEach(sel => sel.onchange = () => { const bk = store.bookings.find(x => x.booking_code === sel.dataset.st); if (bk) { bk.status = sel.value; saveData(); showToast('Status diperbarui.'); renderAdmin(root); } });
      } else if (store.adminTab === 'gallery') {
        body.innerHTML = `<div class="form-stack"><div class="editorial-card card-pad"><form id="g-form" class="form-grid-3" style="align-items:end;"><div><label class="form-label">URL Foto (Opsional)</label><input id="g-url" class="form-control" type="url" placeholder="https://..." /></div><div><label class="form-label">Atau Unggah Foto Lokal</label><input id="g-file" class="form-control" type="file" accept="image/jpeg,image/png,image/webp" /></div><div><label class="form-label">Keterangan</label><input id="g-cap" class="form-control" required /></div><div style="grid-column:1/-1;"><button type="submit" class="btn btn--primary">+ Tambah Galeri</button></div></form></div><div class="grid-cards">${store.gallery.map(g => `<div class="editorial-card" style="overflow:hidden;"><img src="${escapeHtml(sanitizeUrl(g.image, FALLBACK_IMG))}" style="width:100%;height:11rem;object-fit:cover;" /><div style="padding:0.9rem;display:flex;justify-content:space-between;align-items:center;"><strong>${escapeHtml(g.caption)}</strong><button type="button" data-dg="${g.id}" class="btn btn--danger btn--sm">Hapus</button></div></div>`).join('')}</div></div>`;
        body.querySelector('#g-form').onsubmit = async (e) => {
          e.preventDefault();
          const file = body.querySelector('#g-file')?.files?.[0];
          const img = file ? await compressImage(file, 900) : sanitizeUrl(body.querySelector('#g-url').value, FALLBACK_IMG);
          store.gallery.unshift({ id: Date.now(), image: img, caption: body.querySelector('#g-cap').value.trim() });
          saveData(); showToast('Foto galeri ditambahkan.'); renderAdmin(root);
        };
        body.querySelectorAll('[data-dg]').forEach(b => b.onclick = () => { store.gallery = store.gallery.filter(g => g.id !== Number(b.dataset.dg)); saveData(); renderAdmin(root); });
      } else if (store.adminTab === 'about') {
        const curImg = sanitizeUrl(store.settings.about_image, FALLBACK_IMG);
        body.innerHTML = `
          <div class="editorial-card card-pad" style="max-width:48rem;">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:0.5rem;flex-wrap:wrap;margin-bottom:1rem;">
              <div>
                <h3 style="font-size:1.2rem;">Edit Halaman Tentang Kami</h3>
                <p class="form-hint">Perubahan langsung tampil di bagian Tentang Kami pada halaman utama.</p>
              </div>
              <a href="#about" class="btn btn--outline btn--sm">Lihat di Beranda ↗</a>
            </div>
            <form id="about-edit-form" class="form-stack">
              <div class="form-grid-2">
                <div>
                  <label class="form-label">Badge / Label Atas</label>
                  <input id="ab-badge" class="form-control" type="text" required value="${escapeHtml(store.settings.about_badge || '')}" />
                </div>
                <div>
                  <label class="form-label">Teks Tombol CTA</label>
                  <input id="ab-cta" class="form-control" type="text" required value="${escapeHtml(store.settings.about_cta_text || '')}" />
                </div>
              </div>
              <div>
                <label class="form-label">Judul Tentang Kami</label>
                <input id="ab-title" class="form-control" type="text" required value="${escapeHtml(store.settings.about_title || '')}" />
              </div>
              <div>
                <label class="form-label">Deskripsi Tentang Kami</label>
                <textarea id="ab-desc" class="form-control" required>${escapeHtml(store.settings.about_description || '')}</textarea>
              </div>
              <div class="form-grid-2">
                <div>
                  <label class="form-label">URL Foto (Opsional)</label>
                  <input id="ab-url" class="form-control" type="url" value="${escapeHtml(store.settings.about_image?.startsWith('http') ? store.settings.about_image : '')}" placeholder="https://..." />
                </div>
                <div>
                  <label class="form-label">Atau Unggah Foto Baru dari Perangkat</label>
                  <input id="ab-file" class="form-control" type="file" accept="image/jpeg,image/png,image/webp" />
                </div>
              </div>
              <div>
                <span class="form-label">Foto Tentang Kami Saat Ini</span>
                <img id="ab-preview" src="${escapeHtml(curImg)}" onerror="this.src=FALLBACK_IMG" alt="Pratinjau Tentang Kami" style="width:100%;max-height:14rem;object-fit:cover;border-radius:var(--radius-md);border:1px solid var(--color-border-strong);" />
              </div>
              <div>
                <button type="submit" class="btn btn--primary">Simpan Perubahan Tentang Kami</button>
              </div>
            </form>
          </div>
        `;
        body.querySelector('#about-edit-form').onsubmit = async (e) => {
          e.preventDefault();
          const file = body.querySelector('#ab-file')?.files?.[0];
          const urlVal = body.querySelector('#ab-url').value.trim();
          const newImg = file
            ? await compressImage(file, 1000)
            : (urlVal ? sanitizeUrl(urlVal, curImg) : curImg);

          store.settings = {
            ...store.settings,
            about_badge: body.querySelector('#ab-badge').value.trim(),
            about_title: body.querySelector('#ab-title').value.trim(),
            about_description: body.querySelector('#ab-desc').value.trim(),
            about_cta_text: body.querySelector('#ab-cta').value.trim(),
            about_image: newImg
          };
          saveData();
          showToast('Halaman Tentang Kami berhasil diperbarui.');
          renderAdmin(root);
        };
      } else {
        body.innerHTML = `<div class="editorial-card card-pad" style="max-width:40rem;"><h3 style="margin-bottom:1rem;">Pengaturan Kontak &amp; Bank</h3><form id="s-form" class="form-stack"><div class="form-grid-2"><div><label class="form-label">WhatsApp</label><input id="s-wa" class="form-control" value="${escapeHtml(store.settings.whatsapp)}" /></div><div><label class="form-label">Bank</label><input id="s-bk" class="form-control" value="${escapeHtml(store.settings.bank)}" /></div><div><label class="form-label">No. Rekening</label><input id="s-ac" class="form-control" value="${escapeHtml(store.settings.account)}" /></div><div><label class="form-label">Atas Nama</label><input id="s-an" class="form-control" value="${escapeHtml(store.settings.account_name)}" /></div></div><button type="submit" class="btn btn--forest">Simpan Pengaturan</button></form></div>`;
        body.querySelector('#s-form').onsubmit = (e) => { e.preventDefault(); store.settings = { ...store.settings, whatsapp: body.querySelector('#s-wa').value, bank: body.querySelector('#s-bk').value, account: body.querySelector('#s-ac').value, account_name: body.querySelector('#s-an').value }; saveData(); showToast('Pengaturan disimpan.'); };
      }
    }

    function route() {
      const main = document.getElementById('main-content');
      const badge = document.getElementById('header-admin-badge');
      badge.classList.toggle('hidden', !isAdmin());
      document.getElementById('primary-nav').classList.remove('is-open');

      const [r, p] = (location.hash.replace(/^#/, '') || 'home').split('/');
      if (r === 'catalog' || r === 'gallery' || r === 'about') {
        renderHome(main);
        setTimeout(() => document.getElementById(r)?.scrollIntoView({ behavior: 'smooth' }), 40);
      } else if (r === 'book' && p) renderBook(main, p);
      else if (r === 'payment' && p) renderPayment(main, p);
      else if (r === 'track') renderTrack(main);
      else if (r === 'admin') renderAdmin(main);
      else if (r === 'admin-login') isAdmin() ? (location.hash = '#admin') : renderAdminLogin(main);
      else renderHome(main);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('mobile-menu-btn').onclick = () => document.getElementById('primary-nav').classList.toggle('is-open');
    document.getElementById('app-modal-close').onclick = () => document.getElementById('app-modal').close();
    document.getElementById('app-modal').onclick = (e) => { if (e.target.id === 'app-modal') e.target.close(); };
    window.addEventListener('hashchange', route);
    window.addEventListener('DOMContentLoaded', () => { loadData(); route(); });
  </script>
</body>
</html>
